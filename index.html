// ---------- Helpers ----------
const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const normScene = (v) => String(v ?? "").trim().toLowerCase().replace(/[\s-]+/g, "_");
const num = (v, d) => { const n = parseFloat(v); return Number.isFinite(n) ? clamp(n, 0, 100) : d; };
const key = (s) => [s.scene, s.music, s.amb, s.muted].join("|");
function parseRow(payload) {
  let p = payload;
  if (typeof p === "string") { try { p = JSON.parse(p); } catch { p = null; } }
  const r = (p && p.values && p.values[0]) || [];
  return { scene: normScene(r[0]), music: num(r[1], DEFAULTS.music), amb: num(r[2], DEFAULTS.amb), muted: /^true$/i.test(String(r[3] ?? "").trim()) };
}


// ---------- Audio ----------
let AC = null, master = null;
const BUS = {};
const NB = {};
const SCALES = { ionian: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10], phrygian: [0, 1, 3, 5, 7, 8, 10], lydian: [0, 2, 4, 6, 7, 9, 11], mixolydian: [0, 2, 4, 5, 7, 9, 10], aeolian: [0, 2, 3, 5, 7, 8, 10], harmonic: [0, 2, 3, 5, 7, 8, 11] };

function noiseBuffer(kind, secs = 4) {
  const len = AC.sampleRate * secs, b = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch);
    let b0 = 0, b1 = 0, b2 = 0, last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === "white") d[i] = w * 0.5;
      else if (kind === "pink") { b0 = 0.997 * b0 + w * 0.029591; b1 = 0.985 * b1 + w * 0.032534; b2 = 0.95 * b2 + w * 0.048056; d[i] = (b0 + b1 + b2 + w * 0.05) * 1.6; }
      else { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    }
  }
  return b;
}
function impulse(secs) {
  const len = AC.sampleRate * secs, b = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  return b;
}
function initAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 4; comp.connect(AC.destination);
  master = AC.createGain(); master.connect(comp);
  for (const k of ["music", "amb"]) {
    const pre = AC.createGain(), vol = AC.createGain(), rev = AC.createConvolver(), an = AC.createAnalyser();
    rev.buffer = impulse(k === "amb" ? 4 : 3); rev.connect(pre);
    an.fftSize = 2048; pre.connect(an); pre.connect(vol); vol.connect(master); vol.gain.value = 0;
    BUS[k] = { pre, vol, rev, an, buf: new Float32Array(2048) };
  }
  for (const k of ["white", "pink", "brown"]) NB[k] = noiseBuffer(k);
}
function setVolumes() {
  if (!AC) return;
  const t = AC.currentTime;
  BUS.music.vol.gain.setTargetAtTime(state.muted ? 0 : state.music / 100, t, 0.35);
  BUS.amb.vol.gain.setTargetAtTime(state.muted ? 0 : state.amb / 100, t, 0.35);
}
function rms(k) { const b = BUS[k]; b.an.getFloatTimeDomainData(b.buf); let s = 0; for (const v of b.buf) s += v * v; return Math.sqrt(s / b.buf.length); }

// building blocks, each registers what it starts on the layer L so stop() can clean up
function node(L, n) { L.nodes.push(n); return n; }
function every(L, lo, hi, fn) { const go = () => { if (L.dead) return; fn(); L.timers.push(setTimeout(go, rand(lo, hi) * 1000)); }; L.timers.push(setTimeout(go, rand(0, hi) * 500)); }
function filt(type, f, q = 1) { const n = AC.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; }
function gain(v) { const g = AC.createGain(); g.gain.value = v; return g; }
function loopNoise(L, kind) { const s = node(L, AC.createBufferSource()); s.buffer = NB[kind]; s.loop = true; s.start(AC.currentTime, rand(0, 3)); return s; }
function chain(...ns) { for (let i = 0; i < ns.length - 1; i++) ns[i].connect(ns[i + 1]); return ns[ns.length - 1]; }
function wander(L, param, lo, hi, secLo, secHi, tc) { every(L, secLo, secHi, () => param.setTargetAtTime(rand(lo, hi), AC.currentTime, tc)); }
function lfo(L, param, rate, depth, type = "sine") { const o = node(L, AC.createOscillator()); o.type = type; o.frequency.value = rate; const g = gain(depth); o.connect(g); g.connect(param); o.start(); }

  const s = AC.createBufferSource(); s.buffer = NB[kind]; const fl = filt(type, f, 1); const g = gain(0);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  chain(s, fl, g, dest); s.start(t, rand(0, 3), dur + decay); return fl;
}
function tone(dest, type, f, t, peak, attack, decay, f2) {
  const o = AC.createOscillator(), g = gain(0); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + Math.min(decay, 0.3));
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  chain(o, g, dest); o.start(t); o.stop(t + attack + decay + 0.05);

function panned(dest) { const p = AC.createStereoPanner(); p.pan.value = rand(-0.8, 0.8); p.connect(dest); return p; }

  wind(L, o) { const g = gain(o.lvl), bp = filt("bandpass", o.f, o.q || 0.8); chain(loopNoise(L, "pink"), bp, g, L.out); wander(L, bp.frequency, o.f * 0.6, o.f * 1.6, 1.5, 3, 1.2); wander(L, g.gain, o.lvl * 0.35, o.lvl * 1.2, 2, 4, 1.5); },

  thunder(L, o) {
    every(L, o.every * 0.5, o.every * 1.5, () => {
      const t = AC.currentTime + 0.4; flashVisual();
      const s = AC.createBufferSource(); s.buffer = NB.brown; const lp = filt("lowpass", 500), g = gain(0);
      lp.frequency.setValueAtTime(600, t); lp.frequency.exponentialRampToValueAtTime(90, t + 4);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.lvl, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 6);
      chain(s, lp, g, L.out); s.start(t, rand(0, 3), 6.2);
    });
  },
  birds(L, o) {
    every(L, 0.6 / o.rate, 4 / o.rate, () => {
      const dest = panned(L.out); let t = AC.currentTime + 0.05; const base = rand(2200, 4600);
      for (let i = 0, n = 1 + ((Math.random() * 5) | 0); i < n; i++) { const d = rand(0.05, 0.14); tone(dest, "sine", base * rand(0.9, 1.15), t, o.lvl, 0.01, d, base * rand(0.7, 1.4)); t += d + rand(0.02, 0.09); }
    });
  },
  fire(L, o) {
    const g = gain(o.lvl * 0.7); chain(loopNoise(L, "brown"), filt("lowpass", 450), g, L.out); wander(L, g.gain, o.lvl * 0.4, o.lvl * 0.9, 0.1, 0.4, 0.08);
    every(L, 0.03, 0.16, () => { const t = AC.currentTime + 0.02; burst(L.out, "white", t, 0.01, rand(1500, 5000), "highpass", o.lvl * rand(0.15, 0.9), rand(0.01, 0.04)); });
  },

  // canvas generated brush grain laid over the stage in soft light so every scene shares one painterly surface
  const c = document.createElement("canvas"); c.width = 960; c.height = 540; const g = c.getContext("2d");
  g.fillStyle = "#808080"; g.fillRect(0, 0, 960, 540);
  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * 960, y = Math.random() * 540, len = rand(10, 46), ang = rand(-0.6, 0.6) + (i % 2 ? 0 : 1.57), l = Math.random() < 0.5 ? rand(70, 130) : rand(130, 190);
    g.strokeStyle = `rgba(${l},${l},${l},${rand(0.08, 0.24)})`; g.lineWidth = rand(1.5, 7); g.lineCap = "round";
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(ang) * len * 0.5 + rand(-4, 4), y + Math.sin(ang) * len * 0.5 + rand(-4, 4), x + Math.cos(ang) * len, y + Math.sin(ang) * len); g.stroke();
  }
  return c.toDataURL("image/jpeg", 0.8);
}

let painters = [], front = 0, visScene = null;
function flashVisual() { const p = painters[front]; if (p && p.sc.vis.flash) setTimeout(() => (p.flash = 1), 250); }
function crossfadeVisual(sc) {
  const inc = visScene ? 1 - front : front, out = 1 - inc, P = painters[inc];
  P.setScene(sc);
  const ci = P.cv, co = painters[out].cv;
  ci.style.transitionDuration = co.style.transitionDuration = sc.fade + "s";
  ci.style.zIndex = 2; co.style.zIndex = 1; ci.style.opacity = 1;
  if (visScene) setTimeout(() => { if (front === inc) co.style.opacity = 0; }, sc.fade * 1000 + 50);
  front = inc; visScene = sc.id;
  const vid = $("vid");
  if (sc.vis.video) { vid.style.transitionDuration = sc.fade + "s"; vid.src = sc.vis.video; vid.onerror = () => (vid.style.opacity = 0); vid.play().then(() => (vid.style.opacity = 1)).catch(() => (vid.style.opacity = 0)); }
  else vid.style.opacity = 0;
}
let lastT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const t = ts / 1000, dt = Math.min(0.1, t - lastT);
  if (dt < 0.03) return; // about 30 fps is plenty for slow ambience
  lastT = t;
  painters[front].draw(t, dt);
  const other = painters[1 - front]; if (other.cv.style.opacity !== "0" && other.sc) other.draw(t, dt);
}



// ---------- YouTube layers ----------
let ytReady = false; const ytWaiters = [];
window.onYouTubeIframeAPIReady = () => { ytReady = true; ytWaiters.splice(0).forEach((f) => f()); };
const whenYT = () => new Promise((r) => (ytReady ? r() : ytWaiters.push(r)));
const ytFailed = new Set(); // ids that errored this session are skipped next time

// One layer = one scene's visual, music or ambience. It walks the candidate list, then falls back to the
// in page synth (sound) or painter (visual). level() is 0..1 and is applied every fade tick.
class Layer {
  constructor(kind, sc) {
    this.kind = kind; this.sc = sc; this.fade = 0; this.target = 1; this.source = "loading"; this.state = -1; this.dead = false;
    this.list = (YT[sc.id] && YT[sc.id][kind] || []).filter((c) => !ytFailed.has(c.id));
    this.next();
  }
  async next() {
    if (this.dead) return;
    clearTimeout(this.watch);
    if (this.player) { try { this.player.destroy(); } catch {} this.host.remove(); this.player = null; }
    const c = this.list.shift();
    if (!c) return this.backup();
    await whenYT(); if (this.dead) return;
    this.cand = c; this.source = "youtube"; this.state = -1;
    this.host = document.createElement("div");
    const inner = document.createElement("div"); this.host.appendChild(inner);
    if (this.kind === "visual") { this.host.className = "vis"; this.host.style.transitionDuration = this.sc.fade + "s"; $("stage").appendChild(this.host); }
    else $("audioBox").appendChild(this.host);
    const start = Math.floor((c.start || 0) + (this.kind === "music" ? 0 : Math.random() * Math.min(3600, Math.max(0, (c.len || 0) * 0.4))));
    this.start = c.start || 0;
    this.player = new YT.Player(inner, { videoId: c.id, playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, rel: 0, playsinline: 1, modestbranding: 1, start, mute: this.kind === "visual" ? 1 : 0 },
      events: {
        onReady: (e) => { if (this.dead) return; if (this.kind === "visual") e.target.mute(); else { e.target.unMute(); e.target.setVolume(0); } e.target.playVideo(); },
        onStateChange: (e) => { this.state = e.data; if (e.data === 1) { this.playedOnce = true; if (this.kind === "visual") this.host.style.opacity = this.target; } if (e.data === 0) { e.target.seekTo(this.start, true); e.target.playVideo(); } },
        onError: (e) => { console.warn("youtube error", e.data, c.id); ytFailed.add(c.id); this.next(); },
      } });
    // a video that never starts within 25 s is treated as failed
    this.watch = setTimeout(() => { if (!this.playedOnce && !this.dead) { console.warn("youtube timeout", c.id); this.next(); } }, 25000);
  }
  backup() {
    this.source = this.kind === "visual" ? "painted backup" : "synth backup";
    if (this.kind === "visual") { this.painter = startPainter(this.sc); return; }
    if (!AC) return; // audio not unlocked yet; Start session creates it
    this.synth = makeLayer(this.kind === "music" ? "music" : "amb", this.sc);
  }
  get playing() { return this.source === "youtube" ? this.state === 1 : this.source !== "loading"; }
  level(v) {
    if (this.kind === "visual") { if (this.host && this.state === 1) this.host.style.opacity = v > 0.5 ? 1 : 0; if (this.painter) this.painter.cv.style.opacity = v > 0.5 ? 1 : 0; return; }
    if (this.player && this.player.setVolume && this.state !== -1) { try { if (this.player.isMuted()) this.player.unMute(); this.player.setVolume(Math.round(v * 100)); } catch {} }
    if (this.synth) this.synth.out.gain.setTargetAtTime(v, AC.currentTime, 0.05);
  }
  ensureLoop() { // jump back before the end screen appears
    try { const p = this.player; if (p && this.state === 1) { const d = p.getDuration(), t = p.getCurrentTime(); if (d > 60 && t > d - 25) p.seekTo(this.start, true); } } catch {}
  }
  stop() {
    this.dead = true; clearTimeout(this.watch);
    if (this.player) { const p = this.player, h = this.host; if (this.kind === "visual") h.style.opacity = 0; setTimeout(() => { try { p.destroy(); } catch {} h.remove(); }, this.kind === "visual" ? this.sc.fade * 1000 + 300 : 50); }
    if (this.synth) stopLayer(this.synth);
    if (this.painter) stopPainter(this.painter);
  }
}

// painter backup reuses the two canvases
function startPainter(sc) {
  if (!painters.length) { painters = [new Painter($("cvA")), new Painter($("cvB"))]; $("paint").style.backgroundImage = `url(${paintTexture()})`; requestAnimationFrame(frame); }
  $("paint").style.display = "block";
  const p = painters[0].cv.style.opacity === "1" ? painters[1] : painters[0]; front = painters.indexOf(p); visScene = sc.id;
  p.setScene(sc); p.cv.style.transitionDuration = sc.fade + "s"; p.cv.style.zIndex = 1; p.cv.style.opacity = 1; return p;
}
function stopPainter(p) { p.cv.style.opacity = 0; if (!painters.some((q) => q.cv.style.opacity === "1")) $("paint").style.display = "none"; }

// ---------- Scene engine ----------
const live = { visual: null, music: null, amb: null };
function mixFor(sc, kind) { const m = (YT[sc.id] && YT[sc.id].mix) || {}; return kind === "visual" ? 1 : (m[kind] ?? 1); }
function layerTarget(L) { if (L.kind === "visual") return 1; const vol = L.kind === "music" ? state.music : state.amb; return state.muted ? 0 : clamp((vol / 100) * mixFor(L.sc, L.kind), 0, 1); }
const fading = new Set();
function switchScene(sc) {
  for (const kind of ["visual", "music", "amb"]) {
    const old = live[kind];
    if (old) { old.fadeOut = true; old.t0 = performance.now(); old.from = old.fade; }
    const L = new Layer(kind, sc); L.fade = 0; L.t0 = null; live[kind] = L; fading.add(L); if (old) fading.add(old);
  }
}
// one tick drives every fade: new layers ramp up once they actually play, old ones ramp down after their successor starts
setInterval(() => {
  const now = performance.now();
  for (const L of fading) {
    const T = L.sc.fade * 1000;
    if (L.fadeOut) {
      const succ = live[L.kind];
      if (!succ.playing && now - L.t0 < 6000) { L.level(layerTarget(L) * L.fade); continue; } // hold until the next one plays (max 6 s)
      if (!L.outStart) L.outStart = now;
      L.fade = Math.max(0, L.from * (1 - (now - L.outStart) / T));
      L.level(layerTarget(L) * Math.cos((1 - L.fade) * Math.PI / 2));
      if (L.fade <= 0) { L.stop(); fading.delete(L); }
    } else {
      if (!L.playing) continue;
      if (L.t0 === null) L.t0 = now;
      L.fade = Math.min(1, (now - L.t0) / T);
      L.level(layerTarget(L) * Math.sin(L.fade * Math.PI / 2));
      if (L.fade >= 1) fading.delete(L);
    }
  }
  for (const k of ["music", "amb"]) { const L = live[k]; if (L && !fading.has(L)) L.level(layerTarget(L)); }
}, 60);
setInterval(() => Object.values(live).forEach((L) => L && L.ensureLoop()), 2000);

// ---------- Sheet ----------
let state = { ...DEFAULTS }, lastKey = null, started = false;
function parseCsvRow(text) {
  const cells = []; const re = /"((?:[^"]|"")*)"|([^,\n]*)/g; let m;
  const line = text.split("\n")[0];
  while ((m = re.exec(line)) && cells.length < 4) { cells.push(m[1] !== undefined ? m[1].replace(/""/g, '"') : m[2]); if (re.lastIndex >= line.length) break; re.lastIndex++; }
  return { scene: normScene(cells[0]), music: num(cells[1], DEFAULTS.music), amb: num(cells[2], DEFAULTS.amb), muted: /^true$/i.test(String(cells[3] ?? "").trim()) };
}
let sheetError = null, pollDelay = POLL_MS;
async function poll() {
  try {
    const r = await fetch(SHEET_URL(), { cache: "no-store" });
    const text = await r.text();
    if (!r.ok || /^\s*</.test(text)) throw new Error(r.status === 401 || r.status === 403 || /^\s*</.test(text) ? "private" : "http " + r.status);
    const s = parseCsvRow(text);
    if (!SCENES[s.scene]) s.scene = state.scene;
    const k = key(s);
    if (k !== lastKey) { lastKey = k; const prev = state; state = s; if (started && s.scene !== prev.scene) { switchScene(SCENES[s.scene]); showLabel(SCENES[s.scene].name); } }
    sheetError = null; pollDelay = POLL_MS;
  } catch (e) { sheetError = e.message === "private" ? "private" : "net"; pollDelay = Math.min(pollDelay * 2, 30000); }
  renderWarn(); setTimeout(poll, pollDelay);
}

// ---------- TV chrome ----------
let labelTimer = 0, audioBlocked = false;
function showLabel(name) { const el = $("label"); el.textContent = name; el.classList.add("show"); clearTimeout(labelTimer); labelTimer = setTimeout(() => el.classList.remove("show"), 3000); }
function renderWarn() {
  const w = $("warn");
  const msg = audioBlocked ? "Sound is blocked by the browser. Press anywhere to turn it on."
    : sheetError === "private" ? "The control sheet is private. In Google Sheets, Share, General access: Anyone with the link, Viewer."
    : sheetError ? "The control sheet is not reachable right now. Retrying." : "";
  w.textContent = msg; w.hidden = !msg;
}
// YouTube silently mutes a player when the browser blocks sound; detect that
setInterval(() => {
  if (!started) return;
  const L = live.music; let blocked = false;
  try { blocked = !!(L && L.player && L.state === 1 && L.player.isMuted()) || (AC && AC.state !== "running"); } catch {}
  if (blocked !== audioBlocked) { audioBlocked = blocked; renderWarn(); }
}, 2000);
document.addEventListener("pointerdown", () => { if (!started) return; if (AC) AC.resume(); for (const k of ["music", "amb"]) { const L = live[k]; try { L && L.player && (L.player.unMute(), L.player.playVideo()); } catch {} } });
async function wake() { try { await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });

$("startBtn").addEventListener("click", async () => {
  initAudio(); BUS.music.vol.gain.value = 1; BUS.amb.vol.gain.value = 1; try { await AC.resume(); } catch {}
  started = true; $("start").hidden = true;
  switchScene(SCENES[state.scene]); showLabel(SCENES[state.scene].name);
  try { await document.documentElement.requestFullscreen?.(); } catch {}
  wake();
});
window.SB = { get state() { return state; }, status: () => Object.fromEntries(Object.entries(live).map(([k, L]) => [k, L && { scene: L.sc.id, source: L.source, id: L.cand && L.source === "youtube" ? L.cand.id : null, state: L.state, playing: L.playing, fade: +L.fade.toFixed(2) }])) };
poll();
</script>
